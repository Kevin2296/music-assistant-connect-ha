name: Test Home Assistant app
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r music_assistant_connect/requirements.txt pytest pytest-asyncio pyyaml
      - run: python -m pytest -q music_assistant_connect/tests
      - name: Check root-only Supervisor options and privilege drop on Linux
        run: sudo "$(which python)" music_assistant_connect/tests/startup_permissions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test music_assistant_connect/tests/helpers.test.cjs
      - run: node --check music_assistant_connect/app/static/app.js
      - run: python -m playwright install --with-deps chromium
      - run: python music_assistant_connect/tests/ui_smoke.py
      - name: Check HA app metadata
        run: |
          python - <<'PY'
          import yaml
          repo=yaml.safe_load(open('repository.yaml'))
          cfg=yaml.safe_load(open('music_assistant_connect/config.yaml'))
          assert repo['name']
          assert cfg['ingress'] is True
          assert 'ports' not in cfg
          assert cfg['slug']=='music_assistant_connect'
          print('Metadata OK')
          PY
