name: "Music Assistant Connect"
version: "0.6.2"
slug: "music_assistant_connect"
description: "Muziekdiensten koppelen vanaf je telefoon in Home Assistant (prototype)"
url: "https://github.com/Kevin2296/music-assistant-connect-ha"
arch:
  - amd64
  - aarch64
stage: experimental
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8675
panel_title: "Music Connect"
panel_icon: mdi:music-circle
