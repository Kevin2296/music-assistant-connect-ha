# Read-only lookup of the MA app and saving this app's own options (default role).
hassio_api: true
options:
  ma_url: "http://172.30.32.1:8095"
  ma_token: ""
  ma_ui_url: ""
schema:
  ma_url: str?
  ma_token: password?
  ma_ui_url: str?
